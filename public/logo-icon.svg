<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#FFFBEB"/>
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="#FEF3C7" stroke-width="2"/>

  <!-- Drop Shadow Path for 3D/Neon effect -->
  <path d="M 176 368 L 176 192 A 80 80 0 0 1 336 192 A 80 80 0 0 1 208 256 C 256 256, 296 304, 336 368"
        fill="none" stroke="#EA580C" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"
        transform="translate(0, 16)" filter="url(#shadow)" opacity="0.5" />

  <!-- Main Flowing Ribbon 'R' -->
  <path d="M 176 368 L 176 192 A 80 80 0 0 1 336 192 A 80 80 0 0 1 208 256 C 256 256, 296 304, 336 368"
        fill="none" stroke="url(#rGrad)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" />
</svg>