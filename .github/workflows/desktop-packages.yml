name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS app bundle
        run: pnpm desktop:build:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package macOS artifacts
        run: |
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/Reseumer.app release/Reseumer-mac.zip
          hdiutil create -volname Reseumer -srcfolder release/mac-arm64/Reseumer.app -ov -format UDZO release/Reseumer.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reseumer-mac
          path: |
            release/Reseumer.dmg
            release/Reseumer-mac.zip
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm desktop:build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reseumer-win
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-mac
      - build-win
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
