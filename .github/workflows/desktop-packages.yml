name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS app bundle
        run: |
          ulimit -n 65536
          pnpm desktop:build:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package macOS artifacts
        run: |
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/Reseumer.app release/Reseumer-mac.zip
          hdiutil create -volname Reseumer -srcfolder release/mac-arm64/Reseumer.app -ov -format UDZO release/Reseumer.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: reseumer-mac
          path: |
            release/Reseumer.dmg
            release/Reseumer-mac.zip
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm desktop:build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: reseumer-win
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  release-preview:
    if: github.ref == 'refs/heads/main'
    needs:
      - build-mac
      - build-win
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "preview-${{ github.run_number }}" dist/* \
            --target "${{ github.sha }}" \
            --title "Preview Build #${{ github.run_number }}" \
            --notes-file - \
            --prerelease \
            --latest=false <<'EOF'
          自动预览版安装包

          - Branch: `${{ github.ref_name }}`
          - Commit: `${{ github.sha }}`
          EOF

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-mac
      - build-win
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
